[project]
name = "arbbot"
version = "0.1.0"
description = "An honest crypto mispricing scanner and paper-trading bot (Binance, Coinbase, Kraken)"
requires-python = ">=3.11"
dependencies = ["websockets>=12,<18", "aiohttp>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arbbot = "arbbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arbbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
