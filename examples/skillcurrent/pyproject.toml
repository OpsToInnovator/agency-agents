[project]
name = "skillcurrent"
version = "0.2.0"
description = "SkillCurrent: shared skill management for teams. One reviewed catalog of SKILL.md files, taken from draft through checks, approval of exact bytes and channel releases to per-environment adoption receipts"
requires-python = ">=3.11"
authors = [{ name = "ApexForm Life Pty Ltd" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skillcurrent = "skillcurrent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skillcurrent*"]

[tool.setuptools.package-data]
skillcurrent = ["web/*.html", "web/assets/*.png", "web/assets/fonts/*.woff2", "web/assets/fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
